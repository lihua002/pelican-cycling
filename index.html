<style>
  :root{
    --ink:#3a4a52;
    --paper:#fdfbf4;
    --accent:#f2a93b;
    --green:#7fb89b;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'Fredoka','Noto Sans SC',system-ui,sans-serif;
    color:var(--ink);
    background:#bfe6f5;
  }
  .stage{position:fixed;inset:0;}
  .stage svg{width:100%;height:100%;display:block;}

  .ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
  .title-block{
    position:absolute;top:5%;left:5%;
    background:rgba(253,251,244,.82);
    border:2px solid rgba(58,74,82,.12);
    border-radius:20px;
    padding:14px 24px;
    box-shadow:0 8px 24px rgba(58,74,82,.12);
  }
  .title-block h1{
    font-size:clamp(22px,3.4vw,40px);
    font-weight:700;letter-spacing:1px;line-height:1.15;
  }
  .title-block .sub{
    font-size:clamp(12px,1.5vw,17px);
    font-weight:500;opacity:.65;margin-top:2px;
  }
  .credit{
    position:absolute;left:5%;bottom:4%;
    background:rgba(253,251,244,.82);
    border:2px solid rgba(58,74,82,.12);
    border-radius:16px;
    padding:10px 18px;
    display:flex;align-items:center;gap:10px;
    box-shadow:0 8px 24px rgba(58,74,82,.12);
  }
  .credit .logo{
    width:34px;height:34px;flex:none;
    border-radius:50%;background:var(--green);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#fff;font-size:15px;
  }
  .credit .txt{font-size:clamp(12px,1.5vw,15px);line-height:1.35;}
  .credit .txt b{font-weight:700;}
  .credit .txt span{opacity:.6;}
  #pauseBtn{
    position:absolute;top:5%;right:5%;
    pointer-events:auto;
    width:clamp(48px,6vw,64px);height:clamp(48px,6vw,64px);
    border-radius:50%;
    border:2px solid rgba(58,74,82,.15);
    background:rgba(253,251,244,.88);
    box-shadow:0 8px 24px rgba(58,74,82,.18);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .18s ease,background .18s ease;
  }
  #pauseBtn:hover{transform:scale(1.07);background:#fff;}
  #pauseBtn:active{transform:scale(.95);}
  #pauseBtn svg{width:46%;height:46%;}
  #pauseBtn .icon-pause{display:block;}
  #pauseBtn .icon-play{display:none;}
  body.paused #pauseBtn .icon-pause{display:none;}
  body.paused .icon-play{display:block;}

  .scroll{will-change:transform;}
  @keyframes scrollX{from{transform:translateX(0);}to{transform:translateX(-1280px);}}
  @keyframes scrollX2{from{transform:translateX(1280px);}to{transform:translateX(0);}}
  .clouds .scroll-b,.far-hills .scroll-b,.near-hills .scroll-b,.trees .scroll-b,.road-mark .scroll-b,.foregrass .scroll-b{animation-name:scrollX2;}
  .clouds   .scroll{animation:scrollX 12s linear infinite;}
  .far-hills .scroll{animation:scrollX 6s linear infinite;}
  .near-hills .scroll{animation:scrollX 4s linear infinite;}
  .trees    .scroll{animation:scrollX 2.8s linear infinite;}
  .road-mark .scroll{animation:scrollX 1.5s linear infinite;}
  .foregrass .scroll{animation:scrollX 1.5s linear infinite;}

  @keyframes spin{to{transform:rotate(360deg);}}
  .wheel-spin{animation:spin .7s linear infinite;transform-box:fill-box;transform-origin:center;}

  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-5px);}
  }
  .rider-bob{animation:bob .7s ease-in-out infinite;}

  @keyframes wingFlap{
    0%,100%{transform:rotate(0deg);}
    50%{transform:rotate(-2.5deg);}
  }
  .wing{animation:wingFlap .7s ease-in-out infinite;transform-box:fill-box;transform-origin:15% 60%;}

  @keyframes headBob{
    0%,100%{transform:translateY(0) rotate(0);}
    50%{transform:translateY(-2px) rotate(-1deg);}
  }
  .head-move{animation:headBob .7s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}

  @keyframes sunSpin{to{transform:rotate(360deg);}}
  .sun-rays{animation:sunSpin 40s linear infinite;transform-box:fill-box;transform-origin:center;}

  @keyframes floatCloud{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
  }
  .cloud-float{animation:floatCloud 4s ease-in-out infinite;}

  body.paused .scroll,
  body.paused .wheel-spin,
  body.paused .rider-bob,
  body.paused .wing,
  body.paused .head-move,
  body.paused .sun-rays,
  body.paused .cloud-float{animation-play-state:paused;}

  @media (prefers-reduced-motion: reduce){
    .scroll,.wheel-spin,.rider-bob,.wing,.head-move,.sun-rays,.cloud-float{animation:none !important;}
  }
  @media (max-width:640px){
    .title-block{padding:10px 16px;border-radius:16px;}
    .credit{padding:8px 12px;gap:8px;}
    .credit .logo{width:28px;height:28px;font-size:12px;}
    #riderPos{transform:translateX(265px) scale(0.78);}
  }
</style>

<script>
const MID = {x:480, y:470};
const CR = 30;
const HIP_A = {x:398, y:344};
const HIP_B = {x:424, y:342};
const PERIOD = 0.7;

const legA = document.getElementById('legA');
const legB = document.getElementById('legB');
const footA = document.getElementById('footA');
const footB = document.getElementById('footB');
const crankLine = document.getElementById('crankLine');

let theta = 0;
let lastT = performance.now();

function legPath(hip, p){
  const cx = (hip.x + p.x)/2 + 10;
  const cy = (hip.y + p.y)/2 - 10;
  return `M ${hip.x} ${hip.y} Q ${cx} ${cy} ${p.x} ${p.y}`;
}

function frame(now){
  const dt = Math.min((now - lastT)/1000, 0.05);
  lastT = now;
  if(!document.body.classList.contains('paused')){
    theta += dt * (2 * Math.PI / PERIOD);
  }
  const ct = Math.cos(theta), st = Math.sin(theta);
  const p1 = {x:MID.x + CR*ct, y:MID.y + CR*st};
  const p2 = {x:MID.x - CR*ct, y:MID.y - CR*st};

  legA.setAttribute('d', legPath(HIP_A, p1));
  legB.setAttribute('d', legPath(HIP_B, p2));
  footA.setAttribute('transform', `translate(${p1.x},${p1.y})`);
  footB.setAttribute('transform', `translate(${p2.x},${p2.y})`);
  crankLine.setAttribute('x1', p1.x);
  crankLine.setAttribute('y1', p1.y);
  crankLine.setAttribute('x2', p2.x);
  crankLine.setAttribute('y2', p2.y);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const pauseBtn = document.getElementById('pauseBtn');
pauseBtn.addEventListener('click', () => {
  document.body.classList.toggle('paused');
  const paused = document.body.classList.contains('paused');
  pauseBtn.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
  pauseBtn.title = paused ? '播放' : '暂停';
});
</script>
